name: Deploy static showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/showcase/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Validate static showcase
        run: |
          test -s public/showcase/index.html
          grep -q '<title>No Due Management System</title>' public/showcase/index.html

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static showcase
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
